[project]
name = "decksupreme"
version = "0.1.0"
description = "Weekly ELT pipeline that ranks Clash Royale cards from top-1,000 player battles."
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs the running docker compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "dags", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
